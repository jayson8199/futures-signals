name: 加权指数全量重建

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: 拉取 ${{ matrix.range }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        range: ["2008-01-01:2012-12-31", "2013-01-01:2016-12-31", "2017-01-01:2020-12-31", "2021-01-01:2026-12-31"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scanner/requirements.txt tushare
      - name: 恢复按日缓存
        uses: actions/cache@v4
        with:
          path: .cache/bydate
          key: bydate-${{ matrix.range }}-${{ github.run_id }}
          restore-keys: bydate-${{ matrix.range }}-
      - name: 按交易日拉取（290 分钟后主动停止以便保存缓存）
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          R="${{ matrix.range }}"
          echo "缓存已有：$(find .cache/bydate -type f 2>/dev/null | wc -l) 天"
          timeout 17400 python -u scanner/weighted_bydate.py --fetch "${R%%:*}" "${R##*:}" 2>&1 | sed -E 's/tsr_[A-Za-z0-9_-]+/tsr_***/g' | tee fetch.log || true
          echo "缓存现有：$(find .cache/bydate -type f | wc -l) 天"
      - run: cp data/weighted/_trade_days.txt trade_days_${{ strategy.job-index }}.txt 2>/dev/null || true
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-log-${{ strategy.job-index }}
          path: |
            fetch.log
            trade_days_*.txt
          if-no-files-found: ignore

  assemble:
    name: 汇总并提交
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scanner/requirements.txt
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2008-01-01:2012-12-31-" }
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2013-01-01:2016-12-31-" }
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2017-01-01:2020-12-31-" }
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2021-01-01:2026-12-31-" }
      - uses: actions/download-artifact@v4
        with: { pattern: fetch-log-*, path: fetchlogs }
      - name: 汇总（只增不减）
        run: |
          mkdir -p experiments/bydate_logs
          for d in fetchlogs/*/; do n=$(basename "$d"); cp "$d/fetch.log" "experiments/bydate_logs/$n.log" 2>/dev/null || true; done
          for f in fetchlogs/*/trade_days_*.txt; do [ -s "$f" ] && cp "$f" data/weighted/_trade_days.txt && break; done || true
          echo "缓存天数：$(find .cache/bydate -type f 2>/dev/null | wc -l)" | tee experiments/bydate_logs/assemble.log
          python scanner/weighted_bydate.py --assemble 2>&1 | tee -a experiments/bydate_logs/assemble.log
      - name: 提交
        run: |
          git config user.name "futures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weighted/ || true
          git add data/weighted/_trade_days.txt 2>/dev/null || true
          git add experiments/bydate_logs/ || true
          git commit -m "data: 加权指数（按日全市场，只增不减）" || echo "无变化"
          git pull --rebase origin main || true
          git push
