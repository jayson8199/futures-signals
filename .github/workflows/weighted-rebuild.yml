name: 加权指数全量重建

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "品种列表（逗号分隔，留空=全部 54 个）"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: 全量计算加权指数（新浪逐合约，2020 年起）
        run: python scanner/weighted.py --full --symbols "${{ github.event.inputs.symbols }}"
      - name: 提交
        run: |
          git config user.name "futures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weighted/
          git commit -m "data: 加权指数全量重建" || echo "无变化"
          git pull --rebase origin main || true
          git push
