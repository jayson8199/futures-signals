name: 加权指数全量重建

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: 拉取 ${{ matrix.range }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        range: ["2008-01-01:2010-12-31", "2011-01-01:2013-12-31", "2014-01-01:2016-12-31", "2017-01-01:2019-12-31", "2020-01-01:2022-12-31", "2023-01-01:2026-12-31"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scanner/requirements.txt tushare
      - name: 恢复按日缓存
        uses: actions/cache@v4
        with:
          path: .cache/bydate
          key: bydate-${{ matrix.range }}-${{ github.run_id }}
          restore-keys: bydate-${{ matrix.range }}-
      - name: 按交易日拉取全市场合约
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          R="${{ matrix.range }}"; python scanner/weighted_bydate.py --fetch "${R%%:*}" "${R##*:}"
          echo "缓存天数：$(find .cache/bydate -name '*.csv' | wc -l)"

  assemble:
    name: 汇总并提交
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scanner/requirements.txt
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2008-01-01:2010-12-31-" }
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2011-01-01:2013-12-31-" }
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2014-01-01:2016-12-31-" }
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2017-01-01:2019-12-31-" }
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2020-01-01:2022-12-31-" }
      - uses: actions/cache/restore@v4
        with: { path: .cache/bydate, key: x, restore-keys: "bydate-2023-01-01:2026-12-31-" }
      - name: 汇总
        run: |
          echo "缓存天数：$(find .cache/bydate -name '*.csv' 2>/dev/null | wc -l)"
          python scanner/weighted_bydate.py --assemble
      - name: 提交
        run: |
          git config user.name "futures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weighted/
          git commit -m "data: 加权指数全量重建（按日全市场）" || echo "无变化"
          git pull --rebase origin main || true
          git push
