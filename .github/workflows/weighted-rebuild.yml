name: 加权指数全量重建

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "品种列表（逗号分隔，留空=全部 54 个）"
        default: ""
      source:
        description: "数据源：auto（有 token 用 tushare）/ tushare / sina"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt tushare
      - name: 恢复合约缓存（已摘牌合约永不变化，断点续跑）
        uses: actions/cache@v4
        with:
          path: .cache/contracts
          key: contracts-${{ github.run_id }}
          restore-keys: contracts-
      - name: 用仓库里的棕榈油样例预热缓存
        run: |
          mkdir -p .cache/contracts/tushare/P
          if [ -d experiments/tushare_cache/P ]; then cp -n experiments/tushare_cache/P/*.csv .cache/contracts/tushare/P/ 2>/dev/null || true; fi
          echo "缓存中合约数：$(find .cache/contracts -name '*.csv' | wc -l)"
      - name: 全量计算加权指数
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scanner/weighted.py --full --source "${{ github.event.inputs.source || 'auto' }}" --symbols "${{ github.event.inputs.symbols }}"
      - name: 提交
        if: always()
        run: |
          git config user.name "futures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weighted/
          git commit -m "data: 加权指数全量重建" || echo "无变化"
          git pull --rebase origin main || true
          git push
