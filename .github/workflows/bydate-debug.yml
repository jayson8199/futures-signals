name: 按日拉取调试

on:
  workflow_dispatch:
    inputs:
      start: { description: "开始日期", default: "2026-10-01" }
      end: { description: "结束日期", default: "2026-10-15" }

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scanner/requirements.txt tushare
      - name: 拉取并记录日志
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p experiments
          python -u scanner/weighted_bydate.py --fetch "${{ github.event.inputs.start }}" "${{ github.event.inputs.end }}" > experiments/bydate_debug.log 2>&1 || echo "EXIT=$?" >> experiments/bydate_debug.log
          sed -i -E 's/tsr_[A-Za-z0-9_-]+/tsr_***/g' experiments/bydate_debug.log
          echo "--- 缓存文件 ---" >> experiments/bydate_debug.log
          find .cache/bydate -type f | sort | head -50 >> experiments/bydate_debug.log
          for f in $(find .cache/bydate -type f | sort | head -3); do echo "--- $f ($(wc -l < $f) 行)" >> experiments/bydate_debug.log; head -3 "$f" >> experiments/bydate_debug.log; done
          cat experiments/bydate_debug.log
      - name: 提交日志
        if: always()
        run: |
          git config user.name "futures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/bydate_debug.log
          git commit -m "debug: 按日拉取日志" || echo "无变化"
          git pull --rebase origin main || true
          git push
