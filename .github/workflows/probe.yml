name: 数据源探测（实验）

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 北京时间 18:30，官方日报通常已发布
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - run: python scanner/probe_sources.py
      - name: 提交探测结果
        run: |
          git config user.name "futures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/*.json
          git commit -m "probe: $(date -u +%F)" || exit 0
          git pull --rebase origin main || true
          git push
