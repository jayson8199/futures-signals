name: 趋势回测长期数据（手动）

on:
  workflow_dispatch:
    inputs:
      start:
        description: "起始日期 YYYYMMDD"
        default: "20180101"

permissions:
  contents: write

concurrency:
  group: trend-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - run: python scanner/fetch_long.py --start "${{ github.event.inputs.start || '20180101' }}"
      - name: 提交数据
        run: |
          git config user.name "futures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/long
          git commit -m "data: 长期日线 $(date -u +%F)" || exit 0
          git pull --rebase origin main || true
          git push
