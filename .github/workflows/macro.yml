name: 宏观数据（美林时钟）

on:
  workflow_dispatch:
  schedule:
    # 北京时间每月 1 日、16 日 18:20（PMI 月末公布；CPI/PPI 约 9–15 日公布）
    - cron: "20 10 1,16 * *"

permissions:
  contents: write

concurrency:
  group: macro
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - run: python scanner/macro_fetch.py
      - name: 提交数据
        run: |
          git config user.name "futures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro
          git commit -m "data: 宏观数据 $(date -u +%F)" || exit 0
          git pull --rebase origin main || true
          git push
