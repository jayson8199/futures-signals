name: 微信推送

# 通用的微信推送入口：任何定时任务都可以手动触发它，把一段文字发到微信（PushPlus）。
# 用法（gh）：
#   gh api -X POST repos/jayson8199/futures-signals/actions/workflows/wechat-push.yml/dispatches \
#     -f ref=main -f 'inputs[title]=标题' -f 'inputs[content]=正文，可多行'
# 依赖仓库 Secrets 里已有的 PUSHPLUS_TOKEN，以及 scanner/notify.py 里的 send_wechat()。

on:
  workflow_dispatch:
    inputs:
      title:
        description: 推送标题（100 字以内）
        required: true
        type: string
      content:
        description: 推送正文（纯文本，可多行）
        required: true
        type: string

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          pip install -q requests

      - name: 发微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSH_TITLE: ${{ inputs.title }}
          PUSH_CONTENT: ${{ inputs.content }}
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, "scanner")
          try:
              from notify import send_wechat
          except ImportError:
              from scanner.notify import send_wechat
          result = send_wechat(os.environ["PUSH_TITLE"], os.environ["PUSH_CONTENT"])
          print(result)
          if "失败" in result or "未配置" in result:
              # 未配置或发送失败都让这一步变红，方便在 Actions 页面看到
              sys.exit(1)
          EOF
