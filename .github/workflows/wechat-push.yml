name: 微信推送

# 通用的微信推送入口：任何定时任务都可以手动触发它，把一段文字发到微信（PushPlus）。
# 用法（gh）：
#   gh api -X POST repos/jayson8199/futures-signals/actions/workflows/wechat-push.yml/dispatches \
#     -f ref=main -f 'inputs[title]=标题' -f 'inputs[content]=正文，可多行'
# 只依赖仓库 Secrets 里已有的 PUSHPLUS_TOKEN，不加载仓库里任何代码。

on:
  workflow_dispatch:
    inputs:
      title:
        description: 推送标题（100 字以内）
        required: true
        type: string
      content:
        description: 推送正文（纯文本，可多行）
        required: true
        type: string

permissions: {}

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 发微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSH_TITLE: ${{ inputs.title }}
          PUSH_CONTENT: ${{ inputs.content }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          from urllib import parse, request

          token = os.environ.get("PUSHPLUS_TOKEN", "").strip()
          if not token:
              print("PUSHPLUS_TOKEN 没配置，发不了")
              sys.exit(1)

          data = parse.urlencode({
              "token": token,
              "title": os.environ["PUSH_TITLE"][:100],
              "content": os.environ["PUSH_CONTENT"],
              "template": "txt",
          }).encode("utf-8")
          req = request.Request("https://www.pushplus.plus/send", data=data, method="POST")
          try:
              with request.urlopen(req, timeout=30) as resp:
                  r = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
              print(f"微信推送失败: {e}")
              sys.exit(1)

          if r.get("code") == 200:
              print("微信消息已发送")
          else:
              print(f"PushPlus 返回: {r.get('msg', r)}")
              sys.exit(1)
          EOF
