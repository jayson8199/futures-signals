name: 命盘日报

on:
  schedule:
    # 曼谷时间 06:43 主触发；GitHub 定时常延迟或漏发，07:17、07:53、08:37 三个备用触发，
    # 当天（曼谷时间）已发送成功时（含手动或 Claude 补发），备用会自动跳过
    - cron: "43 23 * * *"
    - cron: "17 0 * * *"
    - cron: "53 0 * * *"
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "用哪一天发送（YYYY-MM-DD，留空为今天）"
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: mingpan-daily
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d "$(TZ=Asia/Bangkok date +%Y-%m-%d) 00:00 +0700" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mingpan-daily.yml \
                --status success --created ">=$since" --json databaseId -q length)
          echo "今天（曼谷时间）已成功发送：$n 次"
          if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != '1'
        uses: actions/checkout@v4
      - if: steps.check.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.skip != '1'
        run: pip install lunar_python
      - if: steps.check.outputs.skip != '1'
        env:
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MINGPAN_PROFILE: ${{ secrets.MINGPAN_PROFILE }}
        run: python mingpan/daily.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
