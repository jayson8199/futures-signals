name: 命盘日报

on:
  schedule:
    # 前一天晚上发第二天的日报：曼谷时间 21:07 主触发；GitHub 定时常延迟或漏发，
    # 21:49、22:41 两个备用，第二天早上 06:43 最后保底（那时发的是当天的）。
    # 这一份已发送成功时（含手动或 Claude 补发），备用会自动跳过
    - cron: "7 14 * * *"
    - cron: "49 14 * * *"
    - cron: "41 15 * * *"
    - cron: "43 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "用哪一天发送（YYYY-MM-DD；留空时曼谷 18 点前为今天，18 点起为明天）"
        default: ""
      wechat_test:
        description: "填 1 时只往微信发一份标「可读性测试」的样稿，填别的文字就用它做标注（不发邮件，不算正式发送）；平时留空"
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: mingpan-daily
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 要发的这一份（18 点起是明天的，之前是今天的）从它前一天曼谷 18:00 起算有没有发过
          if [ "$(TZ=Asia/Bangkok date +%H)" -ge 18 ]; then d=$(TZ=Asia/Bangkok date +%Y-%m-%d)
          else d=$(TZ=Asia/Bangkok date -d yesterday +%Y-%m-%d); fi
          since=$(date -u -d "$d 18:00 +0700" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mingpan-daily.yml \
                --status success --created ">=$since" --json databaseId -q length)
          echo "这一份日报已成功发送：$n 次"
          if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != '1'
        uses: actions/checkout@v4
      - if: steps.check.outputs.skip != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.skip != '1'
        run: pip install lunar_python
      - if: steps.check.outputs.skip != '1'
        env:
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MINGPAN_PROFILE: ${{ secrets.MINGPAN_PROFILE }}
          MINGPAN_PERSONAL: ${{ secrets.MINGPAN_PERSONAL }}
          WECHAT_TEST_LABEL: ${{ github.event.inputs.wechat_test }}
        run: python mingpan/daily.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }} ${{ github.event.inputs.wechat_test && '--wechat-test' || '' }}
